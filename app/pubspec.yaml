name: microduck_lew
description: Android landscape controller for mircoduck-lew using keyless LAN UDP.
publish_to: none
version: 0.4.1+5
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/camera.html
    - assets/camera.js
    - assets/microduck-wordmark.png
    - assets/startup-controller.png
    - assets/duck-head-controller.png
