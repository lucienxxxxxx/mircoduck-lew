name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/console-compat.mjs
      - run: python -m compileall -q console scripts gateway
      - run: bash -n scripts/build-robotd.sh scripts/install-robotd.sh scripts/install-udp.sh
  imu-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo test --locked -p duck-control --lib feetech -- --test-threads=1
        working-directory: firmware
